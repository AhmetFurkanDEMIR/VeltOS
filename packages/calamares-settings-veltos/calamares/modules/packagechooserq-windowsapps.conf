# VeltOS: how Windows programs open, Wine (built in) or Bottles (from
# Flathub at the first start). The page is the branding's
# packagechooserq.qml; the choice ("wine" or "bottles") is kept as
# packagechooser_windowsapps (method legacy) for the windows-apps job.
---
qmlSearch: both
mode: required
method: legacy
labels:
    step: ".exe programs"
    step[tr]: ".exe programları"
default: wine
items:
    - id: wine
      name: "Wine"
      description: "VeltOS' own Wine environment"
    - id: bottles
      name: "Bottles"
      description: "Bottles from Flathub, installed at the first start"
