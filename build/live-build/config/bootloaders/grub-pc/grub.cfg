source /boot/grub/config.cfg

# Like Windows: no menu, straight to the VeltOS boot screen. Pressing Esc,
# F4 or holding Shift during these seconds shows the menu (basic graphics,
# advanced options). Upstream live-build shows the menu and waits forever.
set timeout=2
set timeout_style=hidden

# live-build replaces the @...@ placeholders (kernel, initrd, boot options).
menuentry "Start VeltOS" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Start VeltOS with basic graphics" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

submenu "Advanced options..." --hotkey=a {

	source /boot/grub/theme.cfg

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
