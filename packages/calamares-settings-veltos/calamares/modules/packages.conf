# Remove live-session-only packages from the installed system.
# Only packages the live image has: apt refuses the whole removal when it
# does not know a name, and without the network an installed system has no
# package lists to look names up in (the image leaves them out). Debian's
# live-task-localisation and live-task-recommended were listed here and are
# not in VeltOS: every offline installation failed with "Package manager
# error" (QEMU, 2026-10-27). The image's verify hook checks that each name
# below is installed.
---
backend: apt

operations:
  - remove:
      - 'live-boot'
      - 'live-boot-doc'
      - 'live-config'
      - 'live-config-doc'
      - 'live-config-systemd'
      - 'live-tools'
      - 'calamares-settings-veltos'
      - 'calamares'
