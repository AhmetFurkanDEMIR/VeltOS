# VeltOS: how File Explorer mounts drives (udisks2 2.10; see
# /etc/udisks2/mount_options.conf.example).
#
# Windows drives (NTFS) go through ntfs-3g first: it refuses to write to a
# Windows that did not shut down completely (Fast Startup, hibernation),
# which File Explorer then opens read-only, and "windows_names" refuses
# file names that Windows cannot use. The kernel's ntfs3 driver is the
# fallback, with the same file name rule.
[defaults]
ntfs_drivers=ntfs,ntfs3
ntfs:ntfs_defaults=uid=$UID,gid=$GID,windows_names
ntfs:ntfs3_defaults=uid=$UID,gid=$GID,windows_names
