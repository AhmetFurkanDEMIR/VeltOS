# VeltOS: file dialogs of programs that use the desktop portal (Firefox,
# Mail, LibreOffice, Qt and KDE programs through Qt's portal theme) come
# from VeltOS File Explorer in the Windows 11 layout; everything else
# stays with KDE's portal backend. Read by xdg-desktop-portal in a Plasma
# session (XDG_CURRENT_DESKTOP=KDE) before its own kde-portals.conf.
[preferred]
default=kde
org.freedesktop.impl.portal.FileChooser=veltos
