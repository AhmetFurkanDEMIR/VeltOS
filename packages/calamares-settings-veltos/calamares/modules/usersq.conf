# VeltOS installer: account page (QML: branding/veltos/usersq.qml) and
# user account creation (groups from calamares-settings-debian, ISC).
---
qmlSearch: both

userGroup:       users
defaultGroups:
    - cdrom
    - sudo
    - audio
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false

# Like Windows: any password is accepted, but not an empty one (the account
# is the PC's administrator). Calamares 3.3.14 ignores "nonempty" and adds
# libpwquality's checks only when listed; libpwquality cannot go below
# 6 characters and rejected dictionary words even with minlen=0 (the
# installer would not continue with "abcdefg", VM 2026-10-22).
passwordRequirements:
    minLength: 1
    maxLength: -1
allowWeakPasswords: false
