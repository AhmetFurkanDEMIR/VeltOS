# VeltOS: kernel modesetting for NVIDIA's driver (veltos-graphics).
#
# KWin (Plasma on Wayland) and the sign-in screen drive screens only
# through the kernel's modesetting (KMS). Debian 13's NVIDIA modules leave
# it off (nvidia-drm modeset=0 by default in 550.163.01 and Tesla 535), so
# the monitors connected to an NVIDIA card disappeared once NVIDIA's
# driver replaced Nouveau. Debian loads nvidia-drm at start-up
# (/etc/nvidia/nvidia-load.conf); these options make it offer KMS.
#
# Debian renames the module files: the options go to the names modprobe
# loads (nvidia-current-drm, nvidia-current-open-drm, nvidia-tesla-535-drm).
# They do nothing while NVIDIA's driver is not installed.
options nvidia-current-drm modeset=1
options nvidia-current-open-drm modeset=1
options nvidia-tesla-535-drm modeset=1
