<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- VeltOS Snipping Tool: a dashed selection and scissors on a VeltOS
       blue tile. VeltOS artwork. SPDX-License-Identifier: CC-BY-SA-4.0 -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2FA8F0"/>
      <stop offset="0.55" stop-color="#4F7CFF"/>
      <stop offset="1" stop-color="#5B3FE0"/>
    </linearGradient>
    <linearGradient id="blade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE4FF"/>
    </linearGradient>
  </defs>
  <rect x="20" y="24" width="216" height="212" rx="44" fill="#000000" opacity="0.15"/>
  <rect x="20" y="20" width="216" height="212" rx="44" fill="url(#tile)"/>
  <rect x="54" y="54" width="148" height="112" rx="6" fill="#FFFFFF" fill-opacity="0.16"
        stroke="#FFFFFF" stroke-width="8" stroke-dasharray="20 14" stroke-linecap="round"/>
  <!-- scissors -->
  <path d="M 122 120 L 196 196" stroke="url(#blade)" stroke-width="13" stroke-linecap="round"/>
  <path d="M 196 120 L 122 196" stroke="url(#blade)" stroke-width="13" stroke-linecap="round"/>
  <circle cx="111" cy="207" r="19" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <circle cx="207" cy="207" r="19" fill="none" stroke="#FFFFFF" stroke-width="10"/>
  <circle cx="159" cy="158" r="6" fill="#5B3FE0"/>
</svg>
