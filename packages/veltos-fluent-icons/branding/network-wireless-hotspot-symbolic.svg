<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 16 16">
  <!-- Mobile hotspot: a dot sending waves to both sides, the glyph of
       Windows 11's Mobile hotspot tile (VeltOS artwork; drawn as a mask in
       the theme's text colour). Replaces Fluent's, which looked like the
       Wi-Fi icon. SPDX-License-Identifier: CC-BY-SA-4.0 -->
  <defs>
    <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#363636; }</style>
  </defs>
  <g class="ColorScheme-Text" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round">
    <path class="ColorScheme-Text" d="M10.25 5.32A3.5 3.5 0 0 1 10.25 10.68"/>
    <path class="ColorScheme-Text" d="M5.75 5.32A3.5 3.5 0 0 0 5.75 10.68"/>
    <path class="ColorScheme-Text" d="M11.86 3.4A6 6 0 0 1 11.86 12.6"/>
    <path class="ColorScheme-Text" d="M4.14 3.4A6 6 0 0 0 4.14 12.6"/>
  </g>
  <circle class="ColorScheme-Text" fill="currentColor" cx="8" cy="8" r="1.3"/>
</svg>
