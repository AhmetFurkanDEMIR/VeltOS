# GeoClue requests are initiated only by Maps' opt-in "My location" action.
# system=true: Plasma has no GeoClue agent to ask the user, and GeoClue
# refuses an app that needs one (Debian's geoclue.conf allows agents, so it
# waits for one). VeltOS asks itself: location access is off until the user
# turns it on in Maps or Settings > Privacy & security > Location.
[veltos-maps]
allowed=true
system=true
users=
