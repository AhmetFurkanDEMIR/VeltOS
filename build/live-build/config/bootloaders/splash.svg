<?xml version="1.0" encoding="UTF-8"?>
<!--
  VeltOS boot menu background (rendered to 800x600 by live-build).
  SPDX-License-Identifier: CC-BY-SA-4.0
  The logo is packages/veltos-desktop/artwork/veltos-logo.svg (keep in sync;
  tests/repo/test_consistency.py checks it). live-build fills @VERSION@,
  @DISTRIBUTION@ and the date. The lower half is left free for the menu.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#060A1E"/>
      <stop offset="1" stop-color="#0E1A4A"/>
    </linearGradient>
    <radialGradient id="glow" cx="400" cy="150" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3D6CFF" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#3D6CFF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#glow)"/>
  <g transform="translate(355 78) scale(1.40625)">
  <defs>
    <linearGradient id="v-left" x1="8" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#A9CFFF"/>
      <stop offset="1" stop-color="#5E97FF"/>
    </linearGradient>
    <linearGradient id="v-right" x1="56" y1="10" x2="32" y2="54" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4C88FF"/>
      <stop offset="1" stop-color="#1F45DB"/>
    </linearGradient>
  </defs>
  <path d="M 5 10 L 18.5 10 L 38.5 54 L 25 54 Z" fill="url(#v-left)"/>
  <path d="M 45.5 10 L 59 10 L 39 54 L 25.5 54 Z" fill="url(#v-right)"/>
</g>
  <text x="400" y="222" text-anchor="middle" font-family="Inter" font-size="40" font-weight="600" fill="#FFFFFF">VeltOS</text>
  <text x="400" y="252" text-anchor="middle" font-family="Inter" font-size="16" fill="#9FB4E8">Your PC. No Limits.</text>
  <text x="790" y="590" text-anchor="end" font-family="Inter" font-size="11" fill="#56628C">VeltOS @VERSION@ · built @YEAR@-@MONTH@-@DAY@</text>
</svg>
