# Bootloader installation (based on calamares-settings-debian, ISC).
---
efiBootLoader: "grub"
kernel: "/vmlinuz-linux"
img: "/initramfs-linux.img"
fallback: "/initramfs-linux-fallback.img"
timeout: "5"
grubInstall: "grub-install"
grubMkconfig: "grub-mkconfig"
grubCfg: "/boot/grub/grub.cfg"
grubProbe: "grub-probe"
efiBootMgr: "efibootmgr"
# Keep the EFI directory \EFI\debian\: Debian's Secure Boot signed GRUB looks
# for its configuration there, so another name breaks booting with Secure
# Boot on. The firmware menu label is renamed to "VeltOS" by the efi-label
# job that runs right after this module.
efiBootloaderId: "debian"
# Also install \EFI\BOOT\BOOTX64.EFI for firmware that ignores boot entries.
installEFIFallback: true
