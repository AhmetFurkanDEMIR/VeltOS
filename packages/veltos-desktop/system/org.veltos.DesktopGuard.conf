<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<!-- VeltOS desktop guard (/usr/libexec/veltos/veltos-desktop-guard): root
     owns the name; every user may ask it to guard their own desktop. The
     service acts on the calling user only, as the bus identifies them. -->
<busconfig>
  <policy user="root">
    <allow own="org.veltos.DesktopGuard"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.veltos.DesktopGuard" send_interface="org.veltos.DesktopGuard"/>
    <allow send_destination="org.veltos.DesktopGuard" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
