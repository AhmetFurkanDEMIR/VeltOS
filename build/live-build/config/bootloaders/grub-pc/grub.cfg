source /boot/grub/config.cfg

# Boot the default entry automatically; upstream live-build waits forever.
set timeout=10
set timeout_style=menu

# live-build replaces the @...@ placeholders (kernel, initrd, boot options).
menuentry "Start VeltOS" --hotkey=s {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "Start VeltOS (Türkçe)" --hotkey=t {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ locales=tr_TR.UTF-8 keyboard-layouts=tr
	initrd	@INITRD_LIVE@
}

menuentry "Start VeltOS (safe graphics)" --hotkey=g {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

submenu "Utilities..." --hotkey=u {

	source /boot/grub/theme.cfg

	# Firmware setup (UEFI)
	if [ "${grub_platform}" = "efi" ]; then
		menuentry "UEFI Firmware Settings" --hotkey=f {
			fwsetup
		}
	fi

	if @ENABLE_VERIFY_CHECKSUMS@; then
		menuentry "Verify integrity of the boot medium" --hotkey=v {
			linux	@KERNEL_LIVE@ @APPEND_VERIFY_CHECKSUMS@
			initrd	@INITRD_LIVE@
		}
	fi
}
