# User account creation (from calamares-settings-debian, ISC).
---
userGroup:       users
defaultGroups:
    - cdrom
    - sudo
    - audio
    - video
    - plugdev
    - netdev
    - lpadmin
    - scanner
    - bluetooth
autologinGroup:  autologin
sudoersGroup:    sudo
setRootPassword: false
# Like Windows: any non-empty password is accepted.
passwordRequirements:
    nonempty: true
    minLength: -1
    maxLength: -1
    libpwquality:
        - minlen=0
        - minclass=0
