<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <!-- A USB flash drive in Windows 11's style: the Safely Remove Hardware
       notification and anything that shows a USB stick (product owner,
       2026-11-01: a modern flash drive, not a hard disk). VeltOS artwork,
       SPDX-License-Identifier: CC-BY-SA-4.0 -->
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5B8BFF"/>
      <stop offset="1" stop-color="#2F5EE6"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9EDF3"/>
      <stop offset="1" stop-color="#B8C1CE"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g transform="rotate(-45 32 32)">
    <!-- connector -->
    <rect x="22" y="4" width="20" height="16" rx="2" fill="url(#metal)"/>
    <rect x="26" y="8" width="4.5" height="4" rx="0.8" fill="#7C8796"/>
    <rect x="33.5" y="8" width="4.5" height="4" rx="0.8" fill="#7C8796"/>
    <!-- body -->
    <rect x="17" y="18" width="30" height="42" rx="6" fill="url(#body)"/>
    <rect x="17" y="18" width="30" height="18" rx="6" fill="url(#shine)"/>
    <!-- grip and light -->
    <rect x="24" y="44" width="16" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.35"/>
    <rect x="24" y="50" width="16" height="3" rx="1.5" fill="#FFFFFF" fill-opacity="0.35"/>
    <circle cx="32" cy="27" r="2.2" fill="#9EF0C9"/>
  </g>
</svg>
