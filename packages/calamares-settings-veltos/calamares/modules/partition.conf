# VeltOS installer: partitioning.
#
# Disk encryption works like BitLocker: when "Encrypt system" is chosen,
# the system partition is encrypted and /boot is not, so GRUB never has to
# unlock anything. The VeltOS boot screen (Plymouth with
# cryptsetup-initramfs) asks for the password while starting, with the
# keyboard layout chosen during installation, and lets the user try again.
#
# Without this file Calamares put /boot inside the encrypted partition
# (LUKS1); GRUB then asked for the password on a black text screen with a
# US keyboard and fell to "grub rescue" after one failed attempt
# (product owner's VirtualBox install, 2026-10-19).
# Keys: Calamares 3.3.14 src/modules/partition/partition.conf.
---
efi:
    mountPoint: "/boot/efi"
    recommendedSize: 300MiB
    minimumSize: 32MiB
    label: "EFI"

userSwapChoices:
    - none
    - small
    - suspend
    - file
initialSwapChoice: none

drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true

# /boot is unencrypted on purpose (see above): no warning about it.
showNotEncryptedBootMessage: false

defaultFileSystemType: "ext4"
enableLuksAutomatedPartitioning: true
# LUKS1 keeps a system bootable even where the layout below is not used
# (manual partitioning without a separate /boot): GRUB can open LUKS1, not
# LUKS2 with Argon2id.
luksGeneration: luks1

# "Erase disk", "Replace a partition" and "Install alongside" create:
# (EFI system partition, added by Calamares on UEFI) + /boot + system.
partitionLayout:
    - name: "boot"
      filesystem: "ext4"
      noEncrypt: true
      mountPoint: "/boot"
      size: 1GiB
    - name: "veltos"
      filesystem: "ext4"
      mountPoint: "/"
      size: 100%
