# Installed as /usr/lib/systemd/system/sddm.service.d/veltos-plymouth.conf.
# Start the login manager only after the boot splash has quit, as upstream
# SDDM's unit does (Debian's unit has this line commented out). Otherwise
# SDDM can start while Plymouth still holds the display and the automatic
# login of the live session sometimes fails (sddm-helper exits with 63).
[Unit]
After=plymouth-quit.service
