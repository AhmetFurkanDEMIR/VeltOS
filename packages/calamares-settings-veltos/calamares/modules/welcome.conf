# VeltOS installer welcome page and system requirements.
---
showSupportUrl:         false
showKnownIssuesUrl:     false
showReleaseNotesUrl:    false
showDonateUrl:          false

requirements:
    # An installed VeltOS uses about 8 GiB; leave room for apps and updates.
    requiredStorage:    20
    requiredRam:        2.0
    check:
        - storage
        - ram
        - power
        - root
        - screen
    required:
        - storage
        - ram
        - root
