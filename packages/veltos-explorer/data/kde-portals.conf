# VeltOS: file dialogs of programs that use the desktop portal (Firefox,
# Mail, LibreOffice, Qt and KDE programs through Qt's portal theme) come
# from VeltOS File Explorer in the Windows 11 layout; everything else
# stays with KDE's portal backend. Read by xdg-desktop-portal in a Plasma
# session (XDG_CURRENT_DESKTOP=KDE) before its own kde-portals.conf.
#
# KDE's backend has no Lockdown interface, and xdg-desktop-portal 1.20 then
# chose the GTK backend "as a last-resort fallback" when it started; that
# backend waits for graphical-session.target, which comes only after the
# Plasma session is up, so every early portal request waited 25 s at
# sign-in (installed system in QEMU, 2026-10-22). Lockdown is turned off and
# Settings comes from KDE's backend only (Debian's kde-portals.conf, which
# this file replaces, lists "kde;gtk;").
[preferred]
default=kde
org.freedesktop.impl.portal.FileChooser=veltos
org.freedesktop.impl.portal.Settings=kde
org.freedesktop.impl.portal.Lockdown=none
