    <path d="M10.25 5.32A3.5 3.5 0 0 1 10.25 10.68"/>
    <path d="M5.75 5.32A3.5 3.5 0 0 0 5.75 10.68"/>
    <path d="M11.86 3.4A6 6 0 0 1 11.86 12.6"/>
    <path d="M4.14 3.4A6 6 0 0 0 4.14 12.6"/>
  </g>
  <circle fill="currentColor" cx="8" cy="8" r="1.3"/>
</svg>
