<?xml version="1.0" encoding="UTF-8"?>
<!--
  VeltOS authentication prompt icon: the VeltOS "V" on a blue shield, with
  a padlock badge (the product owner: the VeltOS logo and a password icon
  joined into one). SPDX-License-Identifier: CC-BY-SA-4.0
-->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="shield" x1="12" y1="6" x2="52" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F8CFF"/>
      <stop offset="1" stop-color="#1B3BB8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="32" y1="6" x2="32" y2="34" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="v-left" x1="18" y1="14" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4EEFF"/>
      <stop offset="1" stop-color="#B9D2FF"/>
    </linearGradient>
    <linearGradient id="v-right" x1="46" y1="14" x2="32" y2="38" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#E3ECFF"/>
    </linearGradient>
  </defs>
  <!-- shield -->
  <path d="M 32 3 L 57 11 V 29 C 57 44.5 46.5 55.5 32 61 C 17.5 55.5 7 44.5 7 29 V 11 Z" fill="#000000" opacity="0.14" transform="translate(0 1.5)"/>
  <path d="M 32 3 L 57 11 V 29 C 57 44.5 46.5 55.5 32 61 C 17.5 55.5 7 44.5 7 29 V 11 Z" fill="url(#shield)"/>
  <path d="M 32 3 L 57 11 V 29 C 57 44.5 46.5 55.5 32 61 C 17.5 55.5 7 44.5 7 29 V 11 Z" fill="url(#sheen)"/>
  <path d="M 32 5.2 L 55 12.6 V 29 C 55 43.3 45.4 53.6 32 58.8 C 18.6 53.6 9 43.3 9 29 V 12.6 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="1"/>
  <!-- the VeltOS "V": two slanted bars sharing a flat base (veltos-logo.svg,
       scaled by 0.5 and centred on the shield: the logo spans x 5..59, so
       its middle, 32, lands on the shield's middle, 32) -->
  <g transform="translate(16 11) scale(0.5)">
    <path d="M 5 10 L 18.5 10 L 38.5 54 L 25 54 Z" fill="url(#v-left)"/>
    <path d="M 45.5 10 L 59 10 L 39 54 L 25.5 54 Z" fill="url(#v-right)"/>
  </g>
  <!-- padlock badge -->
  <circle cx="47" cy="47" r="12.5" fill="#000000" opacity="0.18" transform="translate(0 1)"/>
  <circle cx="47" cy="47" r="12.5" fill="#FFFFFF"/>
  <circle cx="47" cy="47" r="11.5" fill="none" stroke="#1B3BB8" stroke-opacity="0.25" stroke-width="1"/>
  <path d="M 42.8 46 V 43.2 A 4.2 4.2 0 0 1 51.2 43.2 V 46" fill="none" stroke="#1F45DB" stroke-width="2.2" stroke-linecap="round"/>
  <rect x="40.5" y="45.6" width="13" height="9.4" rx="2" fill="#1F45DB"/>
  <circle cx="47" cy="49.4" r="1.5" fill="#FFFFFF"/>
  <path d="M 47 49.8 V 52.4" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
</svg>
