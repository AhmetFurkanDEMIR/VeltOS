# VeltOS installer (Calamares) configuration.
# Based on calamares-settings-debian 13.0.13 (ISC licence, Jonathan Carter);
# VeltOS changes: branding, Secure Boot capable bootloader setup, firmware
# boot entry label, full component list in the installed APT sources,
# unlimited tries for the disk encryption password, no summary page.
---
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
quit-at-end: false

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
# No summary page: it listed partition commands ("Create new 300MiB
# partition on /dev/vda..."); like Windows Setup, VeltOS only asks for
# confirmation before it changes the disk (prompt-install).
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - crypttab-tries
  - locale
  - keyboard
  - localecfg
  - users
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  - bootloader-config
  - grubcfg
  - bootloader
  - efi-label
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finished

branding: veltos
prompt-install: true
dont-chroot: false
