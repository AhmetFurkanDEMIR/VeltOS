# VeltOS boot defaults, read by update-grub after /etc/default/grub.
# Edit /etc/default/grub.d/zz-local.cfg to override them.
GRUB_DISTRIBUTOR="VeltOS"
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
# Like Windows: no boot menu, straight to the VeltOS boot screen. Esc, F4 or
# Shift during these 2 seconds shows it. When other systems (Windows) are
# installed, /etc/grub.d/35_veltos shows the menu for 5 seconds.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=2
GRUB_THEME=/usr/share/grub/themes/veltos/theme.txt
# A fixed mode instead of "auto": with "auto", GRUB on BIOS systems picked a
# VESA mode that made VirtualBox (running on Hyper-V) stop the VM with a
# triple fault when starting Linux; 1024x768 and 800x600 work (tested).
GRUB_GFXMODE=1024x768,800x600,auto
GRUB_GFXPAYLOAD_LINUX=keep
# Show Windows and other installed systems in the boot menu.
GRUB_DISABLE_OS_PROBER=false
