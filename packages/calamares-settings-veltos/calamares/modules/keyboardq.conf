# VeltOS installer: keyboard page (QML: branding/veltos/keyboardq.qml).
# Calamares' defaults otherwise (Calamares 3.3.14
# src/modules/keyboard/keyboard.conf): the layout goes to
# /etc/default/keyboard (console and boot password screen) and to X11.
---
qmlSearch: both

xOrgConfFileName: "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath: "/lib/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: true
