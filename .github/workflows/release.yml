# A VeltOS release, built and published by GitHub Actions.
#
# A push to main with a new version in VERSION (one that has no tag yet)
# builds every package and the ISO, boots the ISO in QEMU (UEFI, BIOS,
# Secure Boot), makes VeltOS Update's signed package repository from the
# ISO's own packages and publishes the release "vVERSION": the ISO, its
# .sha256, the packages and the repository's index, with
# docs/release-notes/VERSION.md as its text. Then the website and the
# README get the new ISO's link, size and SHA-256 (a commit to main).
# Pushes without a new version build nothing. "Run workflow" (manual) does
# the same as a push.
#
# Needs the repository secret VELTOS_APT_SIGNING_KEY: the ASCII-armoured
# secret key whose public half is veltos-update's archive key
# (packages/veltos-update/data/veltos-archive-keyring.gpg). Without it the
# release stops before building: installed PCs refuse an unsigned index.
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.plan.outputs.version }}
      release: ${{ steps.plan.outputs.release }}
      previous: ${{ steps.plan.outputs.previous }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: plan
        name: Is there a new version?
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          git fetch --tags --force --quiet
          previous="$(git tag -l 'v*' --sort=-v:refname | head -n1)"
          echo "previous=$previous" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "::notice::v$version is already released; change VERSION to make a new release."
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Releasing v$version (previous: ${previous:-none})."
          fi

  release:
    needs: plan
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      VELTOS_VERSION: ${{ needs.plan.outputs.version }}
    steps:
      - name: The signing key is there
        env:
          VELTOS_APT_SIGNING_KEY: ${{ secrets.VELTOS_APT_SIGNING_KEY }}
        run: |
          if [ -z "$VELTOS_APT_SIGNING_KEY" ]; then
            echo "::error::The secret VELTOS_APT_SIGNING_KEY is missing (Settings > Secrets and variables > Actions)."
            exit 1
          fi

      - name: Room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost /usr/local/.ghcup /usr/share/swift
          sudo docker image prune --all --force >/dev/null
          df -h /

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: KVM for the boot tests
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Release check (versions, notes)
        run: |
          git fetch --tags --force --quiet
          python3 build/scripts/release-check.py --version "$VELTOS_VERSION" \
            --previous "${{ needs.plan.outputs.previous }}"

      - name: Builder image
        run: build/run.sh image

      - name: Packages and ISO
        run: build/run.sh iso

      - name: The ISO stays under 2 GiB
        run: |
          iso="$(ls -t out/iso/*/*.iso | head -n1)"
          size="$(stat -c %s "$iso")"
          echo "$iso: $size bytes"
          test "$size" -lt 2147483648

      - name: Boot test (UEFI)
        run: build/run.sh test uefi
      - name: Boot test (BIOS)
        run: build/run.sh test bios
      - name: Boot test (Secure Boot)
        run: build/run.sh test secureboot

      - name: VeltOS Update's package repository
        env:
          VELTOS_APT_SIGNING_KEY: ${{ secrets.VELTOS_APT_SIGNING_KEY }}
        run: build/run.sh apt-repo

      - name: Release files
        id: files
        run: |
          iso="$(ls -t out/iso/*/*.iso | head -n1)"
          name="VeltOS-$VELTOS_VERSION-amd64.iso"
          mkdir -p out/release
          cp "$iso" "out/release/$name"
          (cd out/release && sha256sum "$name" > "$name.sha256")
          sha="$(cut -d' ' -f1 "out/release/$name.sha256")"
          cp out/apt/* out/release/
          python3 build/scripts/release-notes.py "$VELTOS_VERSION" "$name" "$sha" > out/release-notes.md
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c %s "out/release/$name")" >> "$GITHUB_OUTPUT"
          ls -l out/release | head -60

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v$VELTOS_VERSION" out/release/* \
            --target "$GITHUB_SHA" --title "VeltOS $VELTOS_VERSION" \
            --notes-file out/release-notes.md --latest

      - name: Website and README
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/v$VELTOS_VERSION/${{ steps.files.outputs.name }}"
          git fetch origin main
          git checkout -B main origin/main
          python3 build/scripts/update-site.py --version "$VELTOS_VERSION" --iso-url "$url" \
            --size "${{ steps.files.outputs.size }}" --sha256 "${{ steps.files.outputs.sha }}" \
            --date "$(date -u +%F)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/index.html docs/sitemap.xml README.md
          git commit -m "Website and README: VeltOS $VELTOS_VERSION (${{ steps.files.outputs.sha }})"
          git push origin main
          # The website is published from docs/ on main; ask for a build
          # in case the push of the workflow's own token does not start one.
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null || true

      - name: Test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ env.VELTOS_VERSION }}
          path: out/test-results/
          if-no-files-found: ignore
          retention-days: 30
