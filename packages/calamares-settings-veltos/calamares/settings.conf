# VeltOS installer (Calamares) configuration.
# Based on calamares-settings-debian 13.0.13 (ISC licence, Jonathan Carter);
# VeltOS changes: branding, Secure Boot capable bootloader setup, firmware
# boot entry label, full component list in the installed APT sources,
# unlimited tries for the disk encryption password, no summary page, pages
# written in QML in the layout of Windows 11's setup (welcomeq, localeq,
# keyboardq, usersq, finishedq; branding/veltos/*.qml).
---
modules-search: [ local, /usr/lib/calamares/modules ]

oem-setup: false
disable-cancel: false
# While VeltOS is being installed the window shows the slideshow and the
# progress only, like Windows Setup: no Back/Next, and no Cancel (the disk
# has been changed by then; stopping half-way leaves nothing that starts).
disable-cancel-during-exec: true
hide-back-and-next-during-exec: true
quit-at-end: false

sequence:
- show:
  - welcomeq
  - localeq
  - keyboardq
  - partition
  - usersq
# No summary page: it listed partition commands ("Create new 300MiB
# partition on /dev/vda..."); like Windows Setup, VeltOS only asks for
# confirmation before it changes the disk (prompt-install).
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - sources-media
  - machineid
  - fstab
  - crypttab-tries
  - localeq
  - keyboardq
  - localecfg
  # After the keyboard is written, before the initramfs (its keymap).
  - console-cache
  - usersq
  - displaymanager
  - networkcfg
  - hwclock
  - services-systemd
  # The live image carries no initramfs of its own any more (127 MB of
  # the ISO): it is made here, before the bootloader jobs, whose
  # update-grub adds a kernel's initrd line only when the file exists.
  # The live packages go first: live-tools diverts update-initramfs to a
  # wrapper that does nothing while the installer runs from the live
  # medium (it sees boot=live and a read-only medium), so the initramfs
  # job made nothing and the installed system stopped at "Unable to mount
  # root fs" (QEMU, 2026-10-23). boot-check stops an installation that
  # could not start.
  - packages
  - plymouthcfg
  - initramfscfg
  - initramfs
  - bootloader-config
  - boot-resolution
  - grubcfg
  - bootloader
  - efi-label
  - boot-check
  - dpkg-unsafe-io-undo
  - sources-media-unmount
  - sources-final
  - umount
- show:
  - finishedq

branding: veltos
prompt-install: true
dont-chroot: false
