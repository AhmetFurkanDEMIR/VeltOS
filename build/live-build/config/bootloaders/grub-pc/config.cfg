# VeltOS live boot menu: graphics and fonts. Replaces live-build's default
# config.cfg, which is the same except that it also beeps at start-up and
# has no VeltOS fonts.
set default=0

if [ x$feature_default_font_path = xy ] ; then
    font=unicode
else
    font=$prefix/unicode.pf2
fi

if loadfont $font ; then
    set gfxmode=800x600
    set gfxpayload=keep
    insmod efi_gop
    insmod efi_uga
    insmod video_bochs
    insmod video_cirrus
else
    set gfxmode=auto
    insmod all_video
fi

insmod gfxterm
insmod png

source /boot/grub/theme.cfg

terminal_output gfxterm

# Inter, converted for GRUB by veltos-boot (copied in by build-iso.sh), for
# the menu theme. Loaded only after gfxterm has started: gfxterm takes the
# most recently loaded font for its console, and with a proportional font
# it fails ("glyphs too large to fit on screen") and GRUB falls back to the
# firmware's text console without the theme.
for veltos_font in inter-regular-16 inter-semibold-16; do
    loadfont /boot/grub/live-theme/$veltos_font.pf2
done

# Text GRUB prints outside the themed menu ("Booting `Start VeltOS'" when
# an entry starts) is drawn black on black: nothing technical flashes up.
set color_normal=black/black
set color_highlight=black/black
