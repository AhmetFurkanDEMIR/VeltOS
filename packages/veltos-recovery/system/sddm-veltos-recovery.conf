# veltos-recovery: when the sign-in screen keeps failing right after the
# start (systemd gave up restarting it), VeltOS restarts by itself and
# counts the start towards Automatic Repair (boot-failed checks the time).
# Before it starts, safe-graphics chooses X11 for a start without a
# graphics driver (nomodeset: Wayland needs a DRM device).
[Unit]
OnFailure=veltos-boot-failed.service
Wants=veltos-safe-graphics.service
After=veltos-safe-graphics.service
