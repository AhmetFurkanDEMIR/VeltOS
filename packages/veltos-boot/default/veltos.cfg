# VeltOS boot defaults, read by update-grub after /etc/default/grub.
# Edit /etc/default/grub.d/zz-local.cfg to override them.
GRUB_DISTRIBUTOR="VeltOS"
# panic=10: like Windows, restart by itself 10 s after a crash or when the
# system disk cannot be found, instead of stopping; GRUB counts the starts
# and opens Automatic Repair after the second (veltos-recovery). Its own
# entry does not have it, so a disk that cannot be found ends at a shell,
# not in a loop.
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 systemd.show_status=false rd.systemd.show_status=false udev.log_level=3 rd.udev.log_level=3 vt.global_cursor_default=0 panic=10"
# Like Windows: no boot menu, straight to the VeltOS boot screen; during
# these 2 seconds the start screen shows "F6  Recovery" and F6 starts
# VeltOS Recovery (/etc/grub.d/35_veltos, 10_linux). Esc, F4 or Shift shows
# the menu. When other systems (Windows) are installed, the menu is shown
# for 5 seconds.
GRUB_TIMEOUT_STYLE=hidden
GRUB_TIMEOUT=2
GRUB_THEME=/usr/share/grub/themes/veltos/theme.txt
# A fixed mode instead of "auto": with "auto", GRUB on BIOS systems picked a
# VESA mode that made VirtualBox (running on Hyper-V) stop the VM with a
# triple fault when starting Linux; 1024x768 and 800x600 work (tested).
GRUB_GFXMODE=1024x768,800x600,auto
GRUB_GFXPAYLOAD_LINUX=keep
# Show Windows and other installed systems in the boot menu.
GRUB_DISABLE_OS_PROBER=false
